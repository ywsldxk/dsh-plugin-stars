<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSH Plugin Stars - DeepSeek Harness 插件排行榜 / Plugin Leaderboard</title>
  <meta name="description" content="DeepSeek Harness (DSH) plugin leaderboard and directory. DeepSeek Harness（DSH）插件排行榜与插件目录，按 GitHub Stars 排序并自动更新。">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>DSH Plugin Stars</h1>
      <p class="subtitle">DSH 插件越来越多了，这里简单做了个按 GitHub Star 排序的榜单。</p>
      <p class="star-link">
        <a href="https://github.com/ywsldxk/dsh-plugin-stars" target="_blank" rel="noopener noreferrer">在 GitHub 上给本站点 Star</a>
      </p>
      <p class="meta">
        数据更新于 <time id="generated-at" datetime="">--</time>
        <span class="divider">|</span>
        共 <strong id="total-count">0</strong> 个
        <span class="divider">|</span>
        最低 Star <strong id="threshold">0</strong>
      </p>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="筛选与排序">
      <div class="control-group">
        <label for="search">搜索</label>
        <input id="search" type="search" placeholder="仓库名、描述、话题..." autocomplete="off">
      </div>
      <div class="control-group">
        <label for="min-stars">最低 Star</label>
        <input id="min-stars" type="number" min="0" step="1" value="0">
      </div>
      <div class="control-group">
        <label for="sort">排序</label>
        <select id="sort">
          <option value="stars-desc">Star 数（高到低）</option>
          <option value="stars-asc">Star 数（低到高）</option>
          <option value="updated-desc">最近更新（新到旧）</option>
          <option value="updated-asc">最近更新（旧到新）</option>
        </select>
      </div>
    </section>

    <section class="stats" aria-label="统计">
      <div class="stat">
        <span class="stat-value" id="stat-visible">0</span>
        <span class="stat-label">当前显示</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">收录总数</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-max">0</span>
        <span class="stat-label">最高 Star</span>
      </div>
    </section>

    <section class="results" aria-label="插件榜单">
      <div class="empty-state" id="empty-state">
        <p>正在加载数据...</p>
      </div>
      <table class="plugin-table" id="plugin-table" hidden>
        <thead>
          <tr>
            <th scope="col" class="col-rank">#</th>
            <th scope="col" class="col-repo">仓库</th>
            <th scope="col" class="col-desc">描述</th>
            <th scope="col" class="col-stars">Stars</th>
            <th scope="col" class="col-updated">最近更新</th>
            <th scope="col" class="col-links">链接</th>
          </tr>
        </thead>
        <tbody id="plugin-list"></tbody>
      </table>

      <nav id="pagination" class="pagination" aria-label="分页" hidden>
        <button id="prev-page" type="button" aria-label="上一页">上一页</button>
        <span id="page-status" aria-live="polite"></span>
        <button id="next-page" type="button" aria-label="下一页">下一页</button>
      </nav>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        数据来源：<a href="https://github.com/search?q=topic%3Adsh-plugin&type=repositories" target="_blank" rel="noopener noreferrer">GitHub topic:dsh-plugin</a>
        <span class="divider">|</span>
        <a href="https://github.com/ywsldxk/dsh-plugin-stars" target="_blank" rel="noopener noreferrer">本站仓库</a>
      </p>
      <p class="notice">仅展示公开仓库；GitHub 搜索结果上限为 1000 条。</p>
    </div>
  </footer>

  <script src="assets/app.js" type="module"></script>
</body>
</html>
